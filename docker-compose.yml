services:
  db:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # POSTGRES_HOST_AUTH_METHOD: md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes: 
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    
  apicore:
    build:
      context: ./online-courses
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: DOCKER
    depends_on:
      db:
        condition: service_healthy
      apiauth:
        condition: service_started
    ports:
      - "8080:8080"

  apiauth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: DOCKER
    depends_on:
      db:
        condition: service_healthy 
    ports:
      - "8081:8081"
    
  apidoc:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: DOCKER
    depends_on:
      db:
        condition: service_healthy
      apiauth:
        condition: service_started
      apicore:
        condition: service_started
    ports:
      - "8082:8082"

      #

  frontend-nuxt:
    build:
      context: ./online-courses-front-nuxt
      dockerfile: Dockerfile
    depends_on:
      - apicore
      - apiauth
      - apidoc
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL_CORE: http://localhost:8080/api/v1
      NUXT_PUBLIC_API_URL_AUTH: http://localhost:8081/auth/v1
      NUXT_PUBLIC_API_URL_DOC: http://localhost:8082/v1/doc
      NUXT_API_URL_CORE_INTERNAL: http://apicore:8080/api/v1
      NUXT_API_URL_AUTH_INTERNAL: http://apiauth:8081/auth/v1
      NUXT_API_URL_DOC_INTERNAL: http://apidoc:8082/v1/doc

volumes:
  db_data:

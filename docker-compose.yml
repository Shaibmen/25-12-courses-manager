
services:
  db:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes: 
      - db_data:/var/lib/postgresql/data
      - ./db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    
  apicore:
    image: shaibmen/online-courses:latest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      apiauth:
        condition: service_started
    # environment:
    #   DB: ${DB}
    #   LEVEL_LOG: Debug
    #   JWT_SECRET_KEY: gfhxg32q450uh3erfnsdf08najkytg49
    #   DB_USER: postgres
    #   DB_PASSWORD: 1
    #   DB_NAME: 25-12courses
    #   HOST: DB
    ports:
      - "8080:8080"

  apiauth:
    image: shaibmen/auth-service:latest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy 
    # environment:
    #   DB: "host=db port=5432 user=postgres password=1 dbname=25-12courses sslmode=disable"
    #   JWT_SECRET_KEY: gfhxg32q450uh3erfnsdf08najkytg49
    ports:
      - "8081:8081"
    
  apidoc:
    image: metapohuism/document-service:latest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      apiauth:
        condition: service_started
      apicore:
        condition: service_started
    # environment:
    #   PORT: :8082
    ports:
      - "8082:8082"

  frontend:
    image: shaibmen/online-courses-front:latest
    depends_on:
      - apicore
      - apiauth
      - apidoc
    ports:
      - "5173:80"
    environment:
      VITE_API1_URL: http://localhost:8080
      VITE_API2_URL: http://localhost:8081
      VITE_API3_URL: http://localhost:8082

volumes:
  db_data:
